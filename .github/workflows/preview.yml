# Preview for review (plan.md § 3, ADR 0003). Renders one page from a running rig and deploys
# it to GitHub Pages as an artifact: the HTML never enters git, so the marker can come off again.
# Clean-up (§ 4): delete the LANE_MARKER secret and run this again; the banner reads "no marker set".
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to render
        default: '2026-10-28'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y pnpm install --no-frozen-lockfile
      - name: Render the page
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          NIGHT: ${{ inputs.night }}
        run: |
          npx tsx src/server.ts > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/health > /dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf "localhost:8787/digest/$NIGHT" -o _site/index.html
          grep -q "no marker set" _site/index.html && echo "banner: no marker set" || echo "banner: marker set"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
